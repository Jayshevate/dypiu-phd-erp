<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}DYPIU PhD ERP{% endblock %}</title>
<style>
  :root { --fg:#1f2328; --muted:#656d76; --line:#d0d7de; --bg:#fff; --bad:#cf222e; --ok:#1a7f37; --warn:#9a6700; }
  body { font: 15px/1.5 system-ui, sans-serif; color: var(--fg); background: var(--bg); margin: 0 auto; max-width: 1100px; padding: 16px; }
  table { border-collapse: collapse; width: 100%; margin-bottom: 24px; }
  th, td { text-align: left; padding: 6px 8px; border-bottom: 1px solid var(--line); }
  .muted { color: var(--muted); } .overdue { color: var(--bad); } .met { color: var(--ok); } .open { color: var(--warn); }
  header { display:flex; justify-content:space-between; align-items:baseline; border-bottom:1px solid var(--line); margin-bottom:16px; }
</style>
</head>
<body>
<header><h1>DYPIU PhD ERP</h1><nav><a href="{% url 'scholars:dashboard' %}">Dashboard</a> · <a href="{% url 'admin:index' %}">Admin</a></nav></header>
{% block content %}{% endblock %}
</body>
</html>
